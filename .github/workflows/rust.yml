name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
      env:
        CARGO_HTTP_MULTIPLEXING: false
    - name: Run tests
      run: cargo test --verbose
      env:
        CARGO_HTTP_MULTIPLEXING: false
